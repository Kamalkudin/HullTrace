<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Look up a vessel by IMO number and review its identity, ownership and sanctions records.">
  <title>Saved reports Â· HullTrace</title>
  <link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
<a class="skip" href="#workspace">Skip to saved reports</a>
<header class="masthead">
  <div class="mast-inner">
    <a class="brand" href="/" aria-label="HullTrace home"><img src="/favicon.svg" alt="" width="36" height="36">HullTrace</a>
    <nav class="primary-nav" aria-label="Workspace">
      <a href="/">Vessel lookup</a>
      <a href="/saved" aria-current="page">Saved reports</a>
      <a href="/records">Historical records</a>
    </nav>
    <span class="local-label">Local workspace</span>
  </div>
</header>
<main id="workspace" class="page-content">
  <header class="page-heading"><h1>Saved reports</h1>
    <p class="subtitle">Find a previous vessel lookup by ship name or IMO number.</p></header>
  <section class="library" aria-label="Report library">
    <div class="history-controls">
      <label><span class="sr-only">Find a saved report by name or IMO</span><input id="history-filter" type="search" placeholder="Filter by ship name or IMO"></label>
      <button id="refresh-history" class="secondary" type="button">Refresh list</button>
    </div>
    <div id="history" class="history"><p>Loading saved reportsâ€¦</p></div>
  </section>
  <div id="page-message" class="message" role="status" hidden></div>

  <section id="results" aria-labelledby="vessel-name" hidden>
    <div class="result-heading">
      <div><p class="kicker">Saved vessel report</p><h2 id="vessel-name" tabindex="-1"></h2><p id="vessel-meta" class="muted"></p></div>
      <div class="report-actions"><a id="html-report" class="secondary" target="_blank" rel="noopener">Open report</a><a id="json-download" class="secondary" download>Download JSON</a></div>
    </div>
    <div id="metrics" class="metrics"></div>
    <div id="warnings" class="warnings"></div>
    <div class="result-toolbar"><nav id="tabs" class="tabs" aria-label="Report sections"></nav><label class="filter-wrap"><span class="sr-only">Filter findings</span><input id="filter" type="search" placeholder="Filter findings"></label></div>
    <div id="result-content" class="result-content" aria-live="polite"></div>
    <footer class="results-footer"><span id="coverage-summary"></span></footer>
  </section>
</main>
</body>
</html>
